<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yarış Market</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#0b6b3a;
color:white;
text-align:center;
padding:20px;
}

h1{
margin:0;
font-size:34px;
}

p{
margin:8px 0;
}

button{
background:#ff6b00;
color:white;
border:none;
padding:15px 30px;
font-size:18px;
border-radius:10px;
cursor:pointer;
margin-top:15px;
}

.kategoriler{
padding:20px;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.kart{
background:white;
border-radius:15px;
padding:20px;
text-align:center;
font-size:20px;
font-weight:bold;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

footer{
text-align:center;
padding:20px;
}
</style>

</head>

<body>

<header>

<h1>🛒 Yarış Market</h1>

<p>İhtiyacınız Olan Her Şey 1 Telefon Uzağınızda</p>

<button>Alışverişe Başla</button>

</header>

<div class="kategoriler">

<div class="kart">🥖<br>Temel Gıda</div>

<div class="kart">🥩<br>Şarküteri</div>

<div class="kart">🥬<br>Manav</div>

<div class="kart">🥤<br>İçecekler</div>

<div class="kart">🍫<br>Atıştırmalık</div>

<div class="kart">🧴<br>Temizlik</div>

<div class="kart">🔥<br>Piknik & Mangal</div>

<div class="kart">🐾<br>Evcil Hayvan</div>

</div>

<footer>

<p>🚚 30 Dakikada Teslim</p>

<p>💳 Kapıda Kart Ödeme</p>

<p>📱 WhatsApp Sipariş</p>

</footer>

</body>
</html>
